name: Nord Brain Python syntax checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source and tests
        run: python -m compileall -q nord_brain tests
      - name: Run conversation retrieval regression tests
        run: python -m unittest tests.test_context_recall_v18 -v
      - name: Validate contextual ellipses and story continuity
        run: python -m unittest discover -s tests -p 'test_context_ellipses_v19.py' -v

  context-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test full dialogue-to-story routing with real Brain
        run: python -m unittest discover -s tests -p 'test_dialogue_context.py' -v
